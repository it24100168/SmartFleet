name: Deploy API to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish ASP.NET Core API
        run: dotnet publish backend/backend.csproj -c Release -o ./publish --nologo
      - name: Deploy published API
        uses: azure/webapps-deploy@v3
        with:
          app-name: smartfleet-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
